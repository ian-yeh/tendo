name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        env:
          TENDO_SKIP_CHROMIUM_INSTALL: 1
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspaces
      - run: npm run typecheck
      - run: npm test
